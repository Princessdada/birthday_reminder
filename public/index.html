<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Reminder</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f2f5; }
        form { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; }
        h1 { text-align: center; color: #333; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        #message { margin-top: 10px; text-align: center; }
    </style>
</head>
<body>
    <form id="birthdayForm">
        <h1>Birthday Reminder 🎂</h1>
        <input type="text" id="username" placeholder="Username" required>
        <input type="email" id="email" placeholder="Email" required>
        <input type="date" id="dateOfBirth" required>
        <button type="submit">Save Birthday</button>
        <div id="message"></div>
    </form>

    <script>
        document.getElementById('birthdayForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const dateOfBirth = document.getElementById('dateOfBirth').value;
            const messageDiv = document.getElementById('message');

            try {
                const response = await fetch('/users', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, dateOfBirth })
                });

                if (response.ok) {
                    messageDiv.textContent = 'Birthday saved successfully! 🎉';
                    messageDiv.style.color = 'green';
                    e.target.reset();
                } else {
                    const data = await response.json();
                    messageDiv.textContent = 'Error: ' + (data.error || 'Failed to save');
                    messageDiv.style.color = 'red';
                }
            } catch (error) {
                messageDiv.textContent = 'Error connecting to server';
                messageDiv.style.color = 'red';
            }
        });
    </script>
</body>
</html>
